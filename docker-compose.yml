# Local development only. Production is the single-service Dockerfile + render.yaml.
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: hellocare_email
      POSTGRES_PASSWORD: change_me
      POSTGRES_DB: hellocare_email_dev
    ports:
      - "5433:5432"
    volumes:
      - hcc_email_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hellocare_email"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    image: node:20-alpine
    working_dir: /app
    command: sh -c "npm install && npm run migrate && npm run dev"
    volumes:
      - ./backend:/app
      - /app/node_modules
    ports:
      - "4100:4100"
    environment:
      NODE_ENV: development
      DATABASE_URL: postgres://hellocare_email:change_me@postgres:5432/hellocare_email_dev
      CORS_ORIGIN: http://localhost:5174
      JWT_ACCESS_SECRET: dev-only-secret-do-not-use-in-production
    env_file:
      - ./backend/.env
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    image: node:20-alpine
    working_dir: /app
    command: sh -c "npm install && npm run dev -- --host"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    ports:
      - "5174:5174"
    depends_on:
      - backend

volumes:
  hcc_email_pgdata:
